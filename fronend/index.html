```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .create-btn {
            background: #333;
            color: white;
        }

        .update-btn {
            background: #555;
            color: white;
        }

        .delete-btn {
            background: #888;
            color: white;
        }

        .user {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .user-info {
            font-weight: bold;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>User Management</h1>


        <!-- CREATE / UPDATE FORM -->

        <h2>Create / Update User</h2>

        <div class="form-group">

            <label for="userId">
                User ID
            </label>

            <input
                type="number"
                id="userId"
                placeholder="Leave empty when creating"
            >

        </div>


        <div class="form-group">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter name"
            >

        </div>


        <div class="form-group">

            <label for="age">
                Age
            </label>

            <input
                type="number"
                id="age"
                placeholder="Enter age"
            >

        </div>


        <button
            class="create-btn"
            onclick="createUser()"
        >
            Create User
        </button>


        <button
            class="update-btn"
            onclick="updateUser()"
        >
            Update User
        </button>


        <hr>


        <!-- GET USERS -->

        <h2>Users</h2>

        <button onclick="getUsers()">
            Load Users
        </button>


        <div id="userList"></div>

    </div>


    <script>


        // --------------------------------
        // CREATE USER
        // --------------------------------

        async function createUser() {

            const name =
                document.getElementById("name").value;

            const age =
                document.getElementById("age").value;


            const response = await fetch("/users", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,

                    age: Number(age)

                })
            });


            const data =
                await response.json();


            console.log("CREATE response:", data);


            getUsers();

        }


        // --------------------------------
        // GET USERS
        // --------------------------------

        async function getUsers() {

            const response =
                await fetch("/users");


            const users =
                await response.json();


            const userList =
                document.getElementById("userList");


            userList.innerHTML = "";


            users.forEach(user => {

                const userDiv =
                    document.createElement("div");


                userDiv.className = "user";


                userDiv.innerHTML = `

                    <span class="user-info">

                        ID: ${user.id}
                        |
                        Name: ${user.name}
                        |
                        Age: ${user.age}

                    </span>


                    <button
                        class="delete-btn"
                        onclick="deleteUser(${user.id})"
                    >
                        Delete
                    </button>

                `;


                userList.appendChild(userDiv);

            });

        }


        // --------------------------------
        // UPDATE USER
        // --------------------------------

        async function updateUser() {

            const userId =
                document.getElementById("userId").value;

            const name =
                document.getElementById("name").value;

            const age =
                document.getElementById("age").value;


            if (!userId) {

                alert("Enter User ID to update");

                return;

            }


            const response = await fetch(
                `/users/${userId}`,
                {

                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name: name,

                        age: Number(age)

                    })

                }
            );


            const data =
                await response.json();


            console.log("UPDATE response:", data);


            getUsers();

        }


        // --------------------------------
        // DELETE USER
        // --------------------------------

        async function deleteUser(userId) {

            const response = await fetch(
                `/users/${userId}`,
                {

                    method: "DELETE"

                }
            );


            const data =
                await response.json();


            console.log("DELETE response:", data);


            getUsers();

        }


        // --------------------------------
        // LOAD USERS WHEN PAGE OPENS
        // --------------------------------

        // getUsers();

    </script>

</body>

</html>
```
