services:

  
  certbot:
    image: certbot/certbot
    container_name: compose-backend-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
  nginx:
    image: nginx:alpine
    container_name: compose-backend-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend

  backend:
    build: .
    container_name: compose-backend-api
    # ports:
    #   - "8001:8000" # nginx proxy directly call using docker network
    env_file:
      - docker-compose.env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: compose-backend-postgres
    environment:
      POSTGRES_USER: backend-svc-user
      POSTGRES_PASSWORD: backend-svc-pass
      POSTGRES_DB: backend_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U backend-svc-user -d backend_db"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
